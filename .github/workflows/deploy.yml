# Publishes the site to GitHub Pages with fresh content from my Notion databases.
# The quotes, monthly faves and cooking menu are never stored in the repo: each deploy runs
# `npm run sync` with the Notion token kept in repository secrets, and publishes the result.
#
# Runs when I push, after the Substack sync adds a post, every hour (to pick up Notion edits),
# and on demand from the Actions tab: "Deploy site" > "Run workflow".
# If Notion can't be read, the deploy stops and the last published site stays up.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Sync Substack]
    types: [completed]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pull content from Notion
        run: npm run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # the database ids aren't private (they're in .env.example); a secret of the same name overrides them
          NOTION_QUOTES_DB: ${{ secrets.NOTION_QUOTES_DB || '4176e7463165808cb1ebc88caf971a90' }}
          NOTION_FAVES_DB: ${{ secrets.NOTION_FAVES_DB || '4176e7463165806284c9e8ea8825805c' }}
          NOTION_COOKING_DB: ${{ secrets.NOTION_COOKING_DB || '4176e7463165803aa174eaf587d2b804' }}
          NOTION_DRINKS_DB: ${{ secrets.NOTION_DRINKS_DB || '4186e746316581e4bdddc5bb8decc128' }}
          NOTION_FAVORITES_DB: ${{ secrets.NOTION_FAVORITES_DB || '41b6e746316580f79094eef792d4496f' }}
          NOTION_BOOKS_DB: ${{ secrets.NOTION_BOOKS_DB || '4176e746316580cabfcaf1d45eed169e' }}

      - name: Gather the published files
        run: |
          mkdir _site
          cp -R index.html posts.json media data assets _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
